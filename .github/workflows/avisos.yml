# Avisos oficiales de Blizzard sobre WoW Forever para la portada y Noticias (Van, 16-10-2026).
# Cada 20 minutos lee el foro de Blizzard y, si hay algo nuevo, actualiza datos/avisos-blizzard.json (GitHub Pages lo publica solo).
# El script es copia de wow-forever-torneo/avisos_blizzard.py en el PC de Van.
name: Avisos de Blizzard
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: avisos
jobs:
  avisos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 .github/avisos_blizzard.py .
      - run: python3 .github/youtube_directo.py .  # 16-10: ¿Muchamiel en directo en YouTube?
      - run: |  # 29-10: los vídeos de su YouTube para la web, sin depender del Cloudflare de Van
          curl -sfL --max-time 30 "https://www.youtube.com/feeds/videos.xml?channel_id=UCLKDtwQj4YDatBOQPkOlDlA" -o /tmp/feed.xml || exit 0
          grep -q "<entry>" /tmp/feed.xml && mkdir -p datos && cp /tmp/feed.xml datos/youtube-feed.xml || true
      - run: |
          git diff --quiet -- datos/ && exit 0
          git config user.name "avisos-blizzard"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/
          git commit -m "Avisos de Blizzard y directo de YouTube actualizados"
          git push
